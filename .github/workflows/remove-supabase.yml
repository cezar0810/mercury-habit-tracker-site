name: remove-supabase
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/scripts/apply-removal.py
      - run: npm rm @supabase/supabase-js @supabase/ssr
      - run: npm ci && npm run build
      - run: |
          rm -rf .github
          git config user.name "Cezar Albuquerque"
          git config user.email "145135669+cezar0810@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove login com Google e toda a integração com Supabase"
          git push origin main
